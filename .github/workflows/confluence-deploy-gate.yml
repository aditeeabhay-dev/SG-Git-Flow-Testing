name: Confluence Deployment Doc Check

on:
  pull_request:
    branches:
      - main
  issue_comment:
    types: [created]

jobs:
  check-confluence-doc:
    name: Confluence Doc Gate
    runs-on: ubuntu-latest

    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '!rerun-gate'))

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Get PR author for comment trigger
        if: github.event_name == 'issue_comment'
        id: pr_info
        run: |
          PR_AUTHOR=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['user']['login'])")
          echo "pr_author=$PR_AUTHOR" >> $GITHUB_OUTPUT

      - name: Run Confluence doc check
        env:
          CONFLUENCE_EMAIL:      ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN:  ${{ secrets.CONFLUENCE_API_TOKEN }}
          CONFLUENCE_BASE_URL:   ${{ secrets.CONFLUENCE_BASE_URL }}
          BYPASS_ALLOWED_USERS:  ${{ secrets.BYPASS_ALLOWED_USERS }}
          PR_BODY:               ${{ github.event.pull_request.body }}
          TRIGGERED_BY:          ${{ github.event_name }}
          COMMENT_BODY:          ${{ github.event.comment.body }}
          COMMENT_AUTHOR:        ${{ github.event.comment.user.login }}
          PR_NUMBER:             ${{ github.event.issue.number || github.event.pull_request.number }}
          GITHUB_TOKEN:          ${{ secrets.GITHUB_TOKEN }}
          REPO_FULL_NAME:        ${{ github.repository }}
          PR_AUTHOR: >-
            ${{ github.event_name == 'issue_comment'
              && steps.pr_info.outputs.pr_author
              || github.event.pull_request.user.login }}
        run: python scripts/check_confluence_deploy_doc.py
